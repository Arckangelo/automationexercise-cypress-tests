name: Cypress Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # todo dia às 06:00 (UTC), para acompanhar se algum bug conhecido foi corrigido
    - cron: '0 6 * * *'
  workflow_dispatch:

# mínimo por padrão; só o job de publicação recebe permissões extras
permissions:
  contents: read

jobs:
  formatacao:
    name: Formatação e tags
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # só o Prettier: não precisa baixar o Cypress
      - name: Instalar dependências
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: npm ci

      - name: Conferir a formatação
        run: npm run format:check

      # tags só da lista permitida e sempre como texto literal (it e describe)
      - name: Conferir as tags
        run: npm run check:tags

  suite:
    name: Suíte principal (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      # um navegador falhando não cancela os outros: o relatório mostra todos
      fail-fast: false
      matrix:
        browser: [chrome, firefox, edge]
    steps:
      - name: Checkout do código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node (e o npm que vem com ele) na versão do .nvmrc, não na da imagem do
      # runner: atualizar o npm passa a ser uma decisão tomada num PR
      - name: Instalar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # a action instala as dependências com "npm ci", exatamente como no package-lock.json
      - name: Rodar testes Cypress
        uses: cypress-io/github-action@4ce68f262a3888d22cf3175d62010a145ba737ee # v7.4.8
        with:
          command: npm run test:${{ matrix.browser }}

      # testes que só passaram numa nova tentativa (retries) aparecem no resumo
      - name: Resumo de testes instáveis
        if: always()
        run: node scripts/flaky-summary.js ${{ matrix.browser }}

      # pedido criado sem a tag @creates-order falha; tag sem pedido gera aviso
      - name: Conferir pedidos e tag @creates-order
        if: always()
        run: npm run check:orders -- cypress/reports/suite/resumo.json ${{ matrix.browser }}

      - name: Salvar screenshots das falhas
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-suite-${{ matrix.browser }}
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Salvar relatório HTML
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-suite-${{ matrix.browser }}
          path: cypress/reports/suite

      # só existe se o site respondeu a página de espera (ver cypress/support/waitPage.js)
      - name: Salvar página de espera do site
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pagina-de-espera-suite-${{ matrix.browser }}
          path: cypress/reports/pagina-de-espera.html
          if-no-files-found: ignore

  # A proteção da main exige um check chamado "Suíte principal". Com a matriz,
  # cada navegador vira um job próprio; este junta os resultados num só check,
  # que passa apenas se a suíte passou em todos os navegadores.
  suite-resultado:
    name: Suíte principal
    needs: suite
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Conferir os navegadores
        env:
          RESULTADO: ${{ needs.suite.result }}
        run: |
          echo "Resultado da matriz: $RESULTADO"
          [ "$RESULTADO" = "success" ]

  known-bugs:
    name: Bugs conhecidos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node (e o npm que vem com ele) na versão do .nvmrc, não na da imagem do
      # runner: atualizar o npm passa a ser uma decisão tomada num PR
      - name: Instalar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Estes testes falham enquanto os bugs existirem; o job não quebra o
      # pipeline e serve para acompanhar o estado dos bugs no relatório.
      - name: Rodar testes de bugs conhecidos
        id: bugs
        continue-on-error: true
        uses: cypress-io/github-action@4ce68f262a3888d22cf3175d62010a145ba737ee # v7.4.8
        with:
          # os bugs são do site, não do navegador: basta um. Em PR, os testes que
          # criam pedido (@creates-order) ficam de fora; push na main, execução
          # diária e manual rodam todos (ver "Tags" no README)
          command: npm run ${{ github.event_name == 'pull_request' && 'test:bugs:pr' || 'test:bugs' }} -- --browser chrome

      # teste a teste: aponta cada bug que parou de reproduzir, mesmo que os
      # outros continuem falhando (o resultado geral do job esconderia isso)
      - name: Resumo
        if: always()
        run: node scripts/bug-summary.js

      - name: Conferir pedidos e tag @creates-order
        if: always()
        run: npm run check:orders -- cypress/reports/known-bugs/resumo.json bugs-conhecidos

      - name: Salvar relatório HTML
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-known-bugs
          path: cypress/reports/known-bugs

      # só existe se o site respondeu a página de espera (ver cypress/support/waitPage.js)
      - name: Salvar página de espera do site
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pagina-de-espera-known-bugs
          path: cypress/reports/pagina-de-espera.html
          if-no-files-found: ignore

  publicar-relatorio:
    name: Publicar relatório no GitHub Pages
    needs: [suite, known-bugs]
    # publica o relatório só a partir da main (push, agendamento ou manual)
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write      # publicar o site no GitHub Pages
      id-token: write   # token OIDC exigido pelo deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Baixar relatórios
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: relatorio-*
          path: site

      - name: Montar página inicial
        env:
          REPOSITORIO: ${{ github.repository }}
        run: |
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>AutomationExercise - Relatórios de testes</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 16px; color: #1f2937; }
              a { display: block; padding: 16px; margin: 12px 0; border: 1px solid #d1d5db; border-radius: 8px; text-decoration: none; color: inherit; }
              a:hover { border-color: #2563eb; }
              small { color: #6b7280; }
            </style>
          </head>
          <body>
            <h1>AutomationExercise · Relatórios de testes</h1>
            <p><small>Gerado pelo CI em __DATA__ · <a style="display:inline;border:0;padding:0;color:#2563eb" href="https://github.com/__REPOSITORIO__">repositório</a></small></p>
            <a href="relatorio-suite-chrome/index.html"><strong>Suíte principal · Chrome</strong><br><small>Testes de UI e API (devem passar)</small></a>
            <a href="relatorio-suite-firefox/index.html"><strong>Suíte principal · Firefox</strong><br><small>Testes de UI e API (devem passar)</small></a>
            <a href="relatorio-suite-edge/index.html"><strong>Suíte principal · Edge</strong><br><small>Testes de UI e API (devem passar)</small></a>
            <a href="relatorio-known-bugs/index.html"><strong>Bugs conhecidos</strong><br><small>Testes de regressão que falham enquanto os bugs existirem</small></a>
          </body>
          </html>
          EOF
          sed -i "s/__DATA__/$(date -u '+%d\/%m\/%Y %H:%M UTC')/" site/index.html
          sed -i "s|__REPOSITORIO__|${REPOSITORIO}|" site/index.html

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
